# keyboard-quack configuration

# Input method: telex or vni
input_method = "telex"

# Toggle shortcut: none, ctrl_space, ctrl_shift, win_space, ctrl_alt_v,
# ctrl_shift_v, alt_space, capslock, or grave
toggle_key = "none"

# Auto-start on login
auto_start = false

# Show system tray icon
show_tray = true

# Enable Vietnamese input in terminal emulators
enable_terminal = true

# Enable Vietnamese input in password fields (NOT recommended)
enable_password = false

# Debug mode (verbose logging)
debug = false
