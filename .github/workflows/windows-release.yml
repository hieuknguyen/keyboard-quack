name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MinGW UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          location: C:\msys64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc

      - name: Ensure the tag matches the app version
        shell: pwsh
        run: |
          $versionHeader = Get-Content src/version.h -Raw
          if ($versionHeader -notmatch '(?m)^#define QUACK_VERSION ([0-9]+\.[0-9]+\.[0-9]+)\r?$') {
            throw "Could not read QUACK_VERSION from src/version.h."
          }
          $version = $Matches[1]
          $expectedTag = "v$version"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match $expectedTag."
          }

      - name: Build setup
        shell: pwsh
        run: |
          cmd /c build-windows-installer.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME build-windows/keyboard-quack-setup.exe --title $env:GITHUB_REF_NAME --generate-notes
